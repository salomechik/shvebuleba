<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>შვებულებები — ალისფერი აფრები</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF0000'/%3E%3Cpath d='M15 6 L15 23 L7 23 Z M17 9 L25 23 L17 23 Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
@font-face { font-family: 'FiraGO'; font-weight: 400; font-display: swap; src: url(fonts/FiraGO-Regular.woff2) format('woff2'), url(FiraGO-Regular.woff2) format('woff2'); }
@font-face { font-family: 'FiraGO'; font-weight: 600; font-display: swap; src: url(fonts/FiraGO-SemiBold.woff2) format('woff2'), url(FiraGO-SemiBold.woff2) format('woff2'); }
@font-face { font-family: 'FiraGO'; font-weight: 700; font-display: swap; src: url(fonts/FiraGO-Bold.woff2) format('woff2'), url(FiraGO-Bold.woff2) format('woff2'); }

:root {
  --red: #FF0000;
  --red-soft: #FFE5E5;
  --ink: #333333;
  --muted: #6E6E6E;
  --line: #E2E2E2;
  --surface: #F5F5F5;
  --bg: #FFFFFF;
  --off: #EDEDED;
  --ok: #2F2F2F;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'FiraGO', system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; }
.hidden { display: none !important; }

/* ზედა ზოლი */
.top { background: var(--red); color: #fff; }
.top-in { max-width: 1100px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-size: 17px; font-weight: 700; white-space: nowrap; }
.brand span { font-size: 13px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { font-size: 14px; display: flex; align-items: center; gap: 10px; }
.who button { background: transparent; border: 1.5px solid #fff; color: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.who button:hover { background: #fff; color: var(--red); }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

/* ჩანართები */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-color: var(--red); }
.tab .cnt { background: var(--red); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; }

/* ბარათები */
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: var(--bg); }
.stack > * + * { margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.bal { display: flex; flex-direction: column; gap: 6px; }
.bal .lbl { font-weight: 600; color: var(--muted); font-size: 14px; }
.bal .big { font-size: 40px; font-weight: 700; line-height: 1; }
.bal .big small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.bar { height: 8px; background: var(--off); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .u { background: var(--ink); }
.bar .p { background: var(--red); opacity: .35; }

/* ფორმები */
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
input[type=text], input[type=password], input[type=number], input[type=date], select, textarea {
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--ink); font-weight: 400; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600; background: var(--red); color: #fff; }
.btn:hover { background: #E00000; }
.btn:disabled { background: var(--off); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.dark { background: var(--ink); }
.btn.dark:hover { background: #1f1f1f; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--red); color: #fff; }
.err { color: var(--red); font-size: 14px; min-height: 1em; }
.note { background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 14px; }

/* შესვლა */
.login { max-width: 380px; margin: 40px auto; }
.login .card > * + * { margin-top: 14px; }

/* კალენდარი */
.cal { user-select: none; -webkit-user-select: none; max-width: 460px; }
.cal-grid { touch-action: pan-y; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head b { font-size: 16px; }
.cal-nav { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 16px; }
.cal-nav:hover { border-color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 0; }
.cal-d { height: 46px; border-radius: 9px; border: 1.5px solid transparent; display: flex; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; background: #fff; position: relative; font-size: 15px; }
.cal-d:hover { border-color: var(--ink); }
.cal-d.empty { visibility: hidden; }
.cal-d.off { background: var(--off); color: #A8A8A8; cursor: not-allowed; font-weight: 400; }
.cal-d.off:hover { border-color: transparent; }
.cal-d.hol { color: var(--red); opacity: .6; }
.cal-d.past { color: #BDBDBD; cursor: not-allowed; font-weight: 400; }
.cal-d.past:hover { border-color: transparent; }
.cal-d.sel { background: var(--red); color: #fff; }
.cal-d.appr { background: var(--ink); color: #fff; cursor: not-allowed; }
.cal-d.pend { border: 1.5px dashed var(--red); color: var(--red); cursor: not-allowed; }
.cal-d.today::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.hol-tip { min-height: 20px; font-size: 13px; color: var(--muted); margin-top: 6px; }

/* გუნდის კალენდარი */
.tcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.tcal .c { border: 1px solid var(--line); border-radius: 8px; min-height: 86px; padding: 5px; font-size: 12px; overflow: hidden; }
.tcal .c.off { background: var(--surface); }
.tcal .c .n { font-weight: 700; font-size: 13px; }
.tcal .c.off .n { color: #A8A8A8; }
.tcal .who-a, .tcal .who-p { display: block; border-radius: 5px; padding: 1px 5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcal .who-a { background: var(--ink); color: #fff; }
.tcal .who-p { border: 1px dashed var(--red); color: var(--red); }

/* ცხრილები და სიები */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; }
.req { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.req .t { font-weight: 600; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.pill.pending { border: 1.5px dashed var(--red); color: var(--red); }
.pill.approved { background: var(--ink); color: #fff; }
.pill.rejected { background: var(--off); color: var(--muted); }
.pill.cancelled { background: var(--off); color: var(--muted); text-decoration: line-through; }
.pill.offk { background: var(--off); color: var(--muted); }

/* მოდალი */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; z-index: 10; }
.modal .card { width: 100%; max-width: 560px; }
.modal .card > * + * { margin-top: 14px; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 600px) {
  .brand span { display: none; }
  .bal .big { font-size: 34px; }
  .tcal .c { min-height: 64px; font-size: 10px; padding: 3px; }
  .tcal .who-a, .tcal .who-p { padding: 0 3px; }
  .cal-d { font-size: 14px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M15 5 L15 24 L6 24 Z M17 8.5 L26 24 L17 24 Z" fill="#fff"/><path d="M5 26.5 H27" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <b>ალისფერი აფრები</b>
      <span>შვებულებებისა და დეი ოფების აღრიცხვა</span>
    </div>
    <div class="who hidden" id="who"><span id="whoName"></span><button id="logout">გასვლა</button></div>
  </div>
</header>
<main id="app"><p class="muted">იტვირთება…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
